[package]
name = "bedrock-notes"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted Markdown notes with backlinks, a graph, and native clients"
repository = "https://github.com/Manicharan01/bedrock-notes"
homepage = "https://github.com/Manicharan01/bedrock-notes"
readme = "README.md"
keywords = ["notes", "markdown", "self-hosted", "knowledge-base", "backlinks"]
categories = ["web-programming::http-server", "text-editors"]
license = "MIT"

[lib]
name = "lattice"

[[bin]]
name = "bedrock"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
unicode-normalization = "0.1"
unicode-general-category = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
subtle = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true

