name: Bug report
description: Report a reproducible problem using synthetic notes and redacted logs.
body:
  - type: markdown
    attributes:
      value: Please exclude private notes, keys, tokens, cookies, and server addresses. Use Security for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Bedrock version
      placeholder: 0.4.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, browser, or native client
      placeholder: Windows 11 / Firefox, or Android 14 / native ARM64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small synthetic note if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Include deployment shape (local, Compose, proxy) when relevant.
